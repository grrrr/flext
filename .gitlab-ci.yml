variables:
  GIT_SUBMODULE_STRATEGY: recursive

.prefix:
  stage: build
  tags:
    - docker
    - default
  image: $CI_REGISTRY/docker/pd_max
  variables:
    PDINCLUDEDIR: "/usr/include/pd"

.prefix_win:
  extends: .prefix
  variables:
    PDDIR: "/Pd"
    PDINCLUDEDIR: "$PDDIR/src"
    PDWIN: "https://msp.ucsd.edu/Software/pd-0.55-2.msw.zip"
  before_script:
    - curl -k -O "$PDWIN"
    - fn="${PDWIN##*/}"; unzip "$fn"; mv "${fn%%.msw*}" $PDDIR
    - ls $PDDIR/

.linux_x86_64:
  variables:
    ARCH: x86_64-linux-gnu

.linux_aarch64:
  variables:
    ARCH: aarch64-linux-gnu

.pd_float32:
  variables:
    PDBIN: pd

.pd_float64:
  variables:
    PDBIN: pd64

.build:
  extends: .prefix
  script:
    - ./bootstrap.sh
    - ./configure --host=$ARCH --with-sdkdir=$PDINCLUDEDIR --enable-cmem --enable-system=$PDBIN
    - make
  artifacts:
    paths:
      - tutorial/*/*.$PDEXT
    expire_in: 1h

.test:
  stage: test
  script:
    - $CI_PROJECT_DIR/tutorial/pd/test.sh $CI_PROJECT_DIR $PDBIN


build_linux_x86_64_float32:
  extends: [.build, .linux_x86_64, .pd_float32]
  variables:
    PDEXT: pd_linux

build_linux_x86_64_float64:
  extends: [.build, .linux_x86_64, .pd_float64]
  variables:
    PDEXT: linux-amd64-64.so

test_linux_x86_64_float32:
  extends: [.test, .linux_x86_64, .pd_float32]
  depends: build_linux_x86_64_float32

test_linux_x86_64_float64:
  extends: [.test, .linux_x86_64, .pd_float64]
  depends: build_linux_x86_64_float64


build_linux_aarch64_float32:
  extends: [.build, .linux_aarch64, .pd_float32]
  variables:
    PDEXT: pd_linux

build_linux_aarch64_float64:
  extends: [.build, .linux_aarch64, .pd_float64]
  variables:
    PDEXT: linux-arm64-64.so

test_linux_aarch64_float32:
  extends: [.test, .linux_aarch64, .pd_float32]
  depends: build_linux_aarch64_float32

test_linux_aarch64_float64:
  extends: [.test, .linux_aarch64, .pd_float64]
  depends: build_linux_aarch64_float64


push_github:
  stage: deploy
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  image: $CI_REGISTRY/docker/push_github
  tags:
    - docker
    - default
  script:
    - echo "Pushing to github"
